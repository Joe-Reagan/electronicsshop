<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Electronics</title>
        <link rel="stylesheet" href="../hamburger-menu.css">
        <style>
            body{
    background-color: #1A0F00;
    color: #fff;
            }
            .mult{
    display:flex;
    flex-direction:row;
    width:70%;
    height: 90%;
    justify-content:center;
    margin-top: 12%;
    border:2px solid #1A0F00;
    border-radius: 20px 20px 20px 20px;
    


}
input[type="name"]{
    width: 500px;
    padding: 10px;
    border: 1px solid #1A0F00;
    border-radius: 5px;
}
input[type="name"]:focus{
    outline: none;
    border-color: #007BFF;
}
input[type="name"]:hover{
    border-color: #007BFF;
}   
input[type="email"]{
    width: 500px;
    padding: 10px;
    border: 1px solid #1A0F00;
    border-radius: 5px;
}
input[type="email"]:focus{
    outline: none;
    border-color: #007BFF;
}
input[type="email"]:hover{
    border-color: #007BFF;
}

input[type="password"]{
    width: 500px;
    padding: 10px;
    border: 1px solid #1A0F00;
    border-radius: 5px;
}
input[type="password"]:focus{
    outline: none;
    border-color: #007BFF;
}
input[type="password"]:hover{
    border-color: #007BFF;
}   
input[type="confirm password"]{
    width: 500px;
    padding: 10px;
    border: 1px solid #1A0F00;
    border-radius: 5px;
}
input[type="confirm password"]:focus{
    outline: none;
    border-color: #007BFF;
}
input[type="confirm password"]:hover{
    border-color: #007BFF;
}   


.txt{
    background:#1E2A2A;
    color:#000 ;
    height:auto;
    width:90%;
    border:none;
    border-radius:5px;
    display:inline;
    justify-content:center;
    align-items:center;
    font-size: 60px;
    margin-left:50%;
    border:none;
    border-radius: 40px 20px 40px 20px;
}
.txt p{
    margin: 0;
    padding: 0;
    margin-top:5px;
}

.form{
    display:inline;
    align-items: center;
}
form{
    display:flex;
    flex-direction: column;
    align-items: center;
}
label{
    margin-top: 10px;
    margin-bottom: 5px;
    font-weight: bold; 
    display:block; 

} 
button{
    margin-top: 20px;   
    padding: 10px 20px;
    background-color: #007BFF;
    color: #fff;
    border: none;
    border-radius: 15px;
    cursor: pointer;
}
button:hover{   
    background-color: #0056b3;
}
.form a{
    color: #fff;
    text-decoration: none;
}
.form a:hover{
    text-decoration: underline; 
}
button a{
    color: #fff;
    text-decoration: none;
    margin-left:5px;
}
button a:hover{
    text-decoration: underline;
}
h1{
    font-size: 60px;
}

        </style>
        <link rel="stylesheet" href="auth.css">
    </head>

    <body class="auth-page">
        <header class="auth-site-nav">
            <a class="auth-site-brand" href="index.html">Joe Electronics</a>
            <nav class="auth-site-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="index.html#laptops">Products</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </nav>
        </header>
        <div class="mult">
        <div class="txt">
            <p>
            Welcome to Joe <br>Electronic store!
             
            </p>
            <button class="login-btn"><a href="login.html">Already have an account? Login</a></button>
        </div>
        <div class="form">
            <form id="register-form">
                <h1>Sign Up</h1>
                <p id="auth-message" class="store-message" data-server-status hidden></p>
                <label for="name">Name</label>
                <input type="text" placeholder="Name" id="name" name="fullName" autocomplete="name" required>

                <label for="email">Email</label>
                <input type="email" placeholder="Email" id="email" name="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input type="password" placeholder="Password" id="password" name="password" autocomplete="new-password" required>

                <label for="confirm-password">Confirm Password</label>
                <input type="password" placeholder="Confirm Password" id="confirm-password" name="confirmPassword" autocomplete="new-password" required>

                <button type="submit">Create account</button>

            </form>
        </div>
        </div>
        <footer class="auth-site-footer">
            <p>&copy; 2026 Electronics Store. All rights reserved.</p>
            <nav class="auth-footer-links" aria-label="Footer navigation">
                <a href="index.html">Home</a>
                <a href="index.html#laptops">Products</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </nav>
        </footer>
        <script src="store-api.js"></script>
        <script src="store-auth.js"></script>
    </body>
</html>
